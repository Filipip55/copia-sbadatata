[project]
name = "game-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.18,<6",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]
src = ["backend_django"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]
# D203/D213 conflict with D211/D212; module/package/Meta docstrings are optional.
ignore = ["D100", "D104", "D106", "D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
# Test method names are self-describing; Italian docstrings don't fit D401's English check.
"**/tests.py" = ["D102"]
"**/*.py" = ["D401"]
