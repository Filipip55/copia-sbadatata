<div
  class="container not-found-wrapper d-flex flex-column align-items-center justify-content-center text-center py-5"
>
  <div class="not-found-content px-3">
    @if (activeTheme() === 'dark') {
      <img class="not-found-symbol mb-3" src="/brand/symbol-dark.svg" alt="Game Inn" />
    } @else {
      <img class="not-found-symbol mb-3" src="/brand/symbol-light.svg" alt="Game Inn" />
    }
    <div class="error-code fw-bold text-primary mb-2">404</div>
    <h1 class="h2 mb-3 fw-semibold">Pagina non trovata</h1>
    <p class="text-body-secondary mb-4 mx-auto not-found-description">
      La pagina che stai cercando non esiste, è stata rimossa o l'indirizzo inserito non è corretto.
    </p>
    <div>
      <a
        routerLink="/"
        class="btn btn-primary btn-lg d-inline-flex align-items-center gap-2 px-4 shadow-sm"
      >
        <i class="bi bi-house-door" aria-hidden="true"></i>
        <span>Torna alla Home</span>
      </a>
    </div>
  </div>
</div>
